
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ôn Thi">
<meta name="theme-color" content="#16a085">
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ôn Thi TTHCM</title>
    <style>
        :root {
            --primary: #c0392b;
            --secondary: #2c3e50;
            --success: #27ae60;
            --bg: #f9f9f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            
            /* CHẶN BÔI ĐEN COPY THEO YÊU CẦU */
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
            -webkit-touch-callout: none; /* iOS Safari */
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px;}
        .progress-bar {
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s;
        }
        .question-section { flex-grow: 1; }
        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--secondary);
            line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.4;
            font-size: 1.05rem;
        }
        .option:hover { background: #f0f0f0; }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        .footer-nav {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover { background: #1a252f; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #score-display { font-weight: bold; color: var(--primary); font-size: 1.1rem;}
        #result-screen { display: none; text-align: center; flex-grow: 1; }
        
        /* Jump to question */
        .jump-container { margin-top: 15px; text-align: center; font-weight: bold;}
        .jump-container select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem;}
        
        /* Creator Badge */
        .creator-badge {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 2px dashed #ecf0f1;
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="quiz-screen">
            <header>
                <h1>ÔN THI TTHCM</h1>
            </header>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div class="footer-nav">
                <span id="question-count" style="font-weight: bold; color: #555;">Câu 1 / --</span>
                <span id="score-display">Đúng: 0</span>
            </div>
            
            <div class="jump-container">
                <label style="color: #666;">Chuyển nhanh: </label>
                <select id="jump-select" onchange="jumpToQuestion()"></select>
            </div>
            <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">
            
            <div class="question-section">
                <div id="q-text" class="question-text">Đang tải...</div>
                <div id="options-list" class="options"></div>
            </div>
            <div class="footer-nav" style="justify-content: center; margin-top: 30px;">
                <button id="next-btn" onclick="nextQuestion()" disabled style="width: 100%;">Câu tiếp theo &rarr;</button>
            </div>
        </div>

        <div id="result-screen">
            <h2 style="color: var(--primary); margin-top: 40px;">Hoàn Thành Bài Thi!</h2>
            <div style="font-size: 4rem; margin: 20px 0; color: var(--success); font-weight: 800;" id="final-result"></div>
            <p id="feedback" style="font-size: 1.2rem; color: #555; margin-bottom: 30px;"></p>
            <button onclick="location.reload()" style="background: var(--primary); width: 100%; padding: 15px;">Làm lại từ đầu</button>
        </div>
        
        <!-- Dấu ấn người tạo app -->
        <div class="creator-badge">
            © @THDieu
        </div>
    </div>

    <script>
        // CHẶN CHUỘT PHẢI VÀ PHÍM TẮT COPY
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('paste', event => event.preventDefault());

        const quizData = [{"q": "Nguồn gốc lý luận quyết định bản chất tư tưởng Hồ Chí Minh là:", "a": ["A. Nho giáo", "B. Phật giáo", "C. Chủ nghĩa Mác-Lênin", "D. Chủ nghĩa dân tộc"], "c": 2}, {"q": "Theo Người, độc lập dân tộc phải đi đôi với:", "a": ["A. Tư bản chủ nghĩa", "B. Chủ nghĩa xã hội", "C. Phong kiến", "D. Quân chủ"], "c": 1}, {"q": "Giá trị truyền thống nào là cơ sở quan trọng nhất giúp Hồ Chí Minh xây dựng hệ thống quan điểm của mình?", "a": ["A. Chủ nghĩa yêu nước", "B. Tinh thần đoàn kết, có kết cộng đồng", "C. Chủ nghĩa nhân văn của dân tộc", "D. Truyền thống cần cù, yêu lao động"], "c": 0}, {"q": "Luận điểm: \"Dân ta có một lòng nồng nàn yêu nước...\" là của ai?", "a": ["A. Phan Bội Châu", "B. Phan Châu Trinh", "C. Hoàng Hoa Thám", "D. Hồ Chí Minh"], "c": 3}, {"q": "Cách mạng Tháng Mười Nga nổ ra vào năm nào?", "a": ["A. 1915", "B. 1916", "C. 1917", "D. 1918"], "c": 2}, {"q": "Quá trình hình thành và phát triển tư tưởng Hồ Chí Minh được chia thành mấy giai đoạn?", "a": ["A. 4 giai đoạn", "B. 5 giai đoạn", "C. 6 giai đoạn", "D. 7 giai đoạn"], "c": 1}, {"q": "Giá trị của tư tưởng Hồ Chí Minh đối với dân tộc là?", "a": ["A. Tài sản tinh thần vô giá của dân tộc Việt Nam", "B. Phản ánh khát vọng thời đại", "C. Tìm ra các giải pháp đấu tranh giải phóng loài người", "D. Cổ vũ các dân tộc đấu tranh trong sự nghiệp giải phóng"], "c": 0}, {"q": "Hồ Chí Minh bắt gặp Sơ thảo lần thứ nhất luận cương về những vấn đề dân tộc và vấn đề thuộc địa khi nào?", "a": ["A. 7/1920", "B. 12/1920", "C. 6/1923", "D. 2/1930"], "c": 0}, {"q": "Tư tưởng vị tha, từ bi bác ái, cứu khổ cứu nạn là ưu điểm của học thuyết, tôn giáo nào?", "a": ["A. Nho giáo", "B. Phật giáo", "C. Thiên chúa giáo", "D. Hồi giáo"], "c": 1}, {"q": "Đoạn trích sau đây thuộc tác phẩm nào của Hồ Chí Minh: \"Bây giờ học thuyết nhiều... cách mạng nhất là chủ nghĩa Lênin\"?", "a": ["A. Bản án chế độ thực dân Pháp", "B. Đường cách mệnh", "C. Con đường dẫn tôi đến chủ nghĩa Lênin", "D. Cương lĩnh chính trị đầu tiên"], "c": 1}, {"q": "Theo Hồ Chí Minh, trong cuộc cách mạng giải phóng dân tộc, lực lượng nào \"là gốc cách mệnh\"?", "a": ["A. Công nhân", "B. Trí thức", "C. Nông dân", "D. Công - nông"], "c": 3}, {"q": "Trong các luận điểm sau đây, luận điểm nào của Hồ Chí Minh?", "a": ["A. \"Tất cả mọi người đều sinh ra có quyền bình đẳng...\"", "B. \"Người ta sinh ra tự do và bình đẳng về quyền lợi...\"", "C. \"Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do\"."], "c": 2}, {"q": "Theo Hồ Chí Minh, quá độ lên chủ nghĩa xã hội ở Việt Nam là quá độ:", "a": ["A. Trực tiếp lên chủ nghĩa xã hội", "B. Gián tiếp lên chủ nghĩa xã hội", "C. Đi thẳng lên chủ nghĩa xã hội", "D. Bỏ qua thời kỳ tư bản chủ nghĩa"], "c": 1}, {"q": "Bài thơ: \"Gạo đem vào giã bao đau đớn...\" nằm trong tác phẩm nào?", "a": ["A. Ca binh lính", "B. Nhật ký trong tù", "C. Bài ca du kích", "D. Ca sợi chỉ"], "c": 1}, {"q": "Luận điểm: \"Cách mệnh trước hết phải có đảng cách mệnh... Đảng có vững, cách mệnh mới thành công...\" nằm trong tác phẩm:", "a": ["A. Bản án chế độ thực dân Pháp", "B. Di chúc", "C. Cương lĩnh chính trị đầu tiên", "D. Đường cách mệnh"], "c": 3}, {"q": "Theo Hồ Chí Minh, cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường:", "a": ["A. Cách mạng tư sản", "B. Cách mạng vô sản", "C. Cách mạng xã hội chủ nghĩa", "D. Cách mạng ruộng đất"], "c": 1}, {"q": "Chọn phương án trả lời đúng với tư tưởng Hồ Chí Minh:", "a": ["A. Thắng lợi đồng thời với chính quốc", "B. Phụ thuộc vào chính quốc", "C. Song song với cách mạng tư sản", "D. Cách mạng giải phóng dân tộc ở thuộc địa có khả năng giành được thắng lợi trước cách mạng vô sản ở chính quốc."], "c": 3}, {"q": "\"Toàn thể dân tộc Việt Nam quyết đem tất cả tinh thần và lực lượng...\" trích từ:", "a": ["A. Thư kêu gọi Tổng khởi nghĩa", "B. Tuyên ngôn độc lập (1945)", "C. Lời kêu gọi toàn quốc kháng chiến", "D. Thư gửi đồng bào Nam bộ"], "c": 1}, {"q": "Vai trò lãnh đạo củ ": 2}, {"q": "Nền tảng của khối đại đoàn kết dân tộc là:", "a": ["A. Công nhân", "B. Nông dân", "C. Liên minh công - nông - trí thức", "D. Doanh nhân"], "c": 2}, {"q": "Hình thức tổ chức của khối đại đoàn kết dân tộc là gì?", "a": ["A. Chính phủ", "B. Quốc hội", "C. Mặt trận dân tộc thống nhất", "D. Quân đội"], "c": 2}, {"q": "Đoàn kết phải dựa trên nguyên tắc nào?", "a": ["A. Tự do tuyệt đối", "B. Hiệp thương dân chủ", "C. Áp đặt", "D. Cạnh tranh"], "c": 1}, {"q": "Câu nói thể hiện rõ nhất tư tưởng đại đoàn kết?", "a": ["A. \"Không có gì quý hơn độc lập, tự do\"", "B. \"Đoàn kết, đoàn kết, đại đoàn kết – Thành công, thành công, đại thành công\"", "C. \"Cần, kiệm, liêm, chính\"", "D. \"Dĩ bất biến, ứng vạn biến\""], "c": 1}, {"q": "Để xây dựng khối đại đoàn kết cần chống tư tưởng nào?", "a": ["A. Yêu nước", "B. Cục bộ, hẹp hòi", "C. Hợp tác", "D. Đổi mới"], "c": 1}, {"q": "Vai trò của Đảng trong khối đại đoàn kết dân tộc là:", "a": ["A. Đứng ngoài", "B. Lãnh đạo", "C. Phụ thuộc nhân dân", "D. Không có vai trò"], "c": 1}, {"q": "Theo Hồ Chí Minh, văn hóa được hiểu là:", "a": ["A. Chỉ là nghệ thuật", "B. Toàn bộ những giá trị vật chất và tinh thần do con người sáng tạo ra", "C. Chỉ là giáo dục", "D. Chỉ là phong tục tập quán"], "c": 1}, {"q": "Nền văn hóa mới có tính chất gì?", "a": ["A. Dân tộc, khoa học, đại chúng", "B. Hiện đại, hội nhập, toàn cầu", "C. Truyền thống, hiện đại, phát triển", "D. Khoa học, kỹ thuật, công nghệ"], "c": 0}, {"q": "Đạo đức theo tư tưởng Hồ Chí Minh là gì?", "a": ["A. Quy định của pháp luật", "B. Chuẩn mực xã hội", "C. Gốc của người cách mạng", "D. Công cụ quản lý"], "c": 2}, {"q": "Nội dung cốt lõi của đạo đức cách mạng là:", "a": ["A. Trung với nước, hiếu với dân", "B. Giàu có, thành đạt", "C. Tự do cá nhân", "D. Quyền lực chính trị"], "c": 0}, {"q": "Nguyên tắc xây dựng đạo đức là:", "a": ["A. Nói đi đôi với làm", "B. Nói nhiều làm ít", "C. Chỉ cần lý luận", "D. Không cần thực hành"], "c": 0}, {"q": "Phải chống những gì trong xây dựng đ q": "Ưu điểm lớn nhất của học thuyết Khổng Tử:", "a": ["A. Hiếu học", "B. Quản lý bằng đạo đức", "C. Sự tu dưỡng đạo đức cá nhân", "D. Tự do"], "c": 2}, {"q": "Tư tưởng bồi dưỡng thế hệ trẻ:", "a": ["A. Không cần đạo đức", "B. Chỉ kiến thức", "C. Kết hợp giáo dục toàn diện đức – trí – thể – mỹ", "D. Chỉ kỹ năng"], "c": 2}, {"q": "Vì sao phải tôn trọng và phát huy quyền làm chủ của nhân dân?", "a": ["A. Giảm trách nhiệm Nhà nước", "B. Vì nhân dân là chủ thể sáng tạo lịch sử", "C. Yêu cầu quốc tế", "D. Hình thức"], "c": 1}];
        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function initJumpSelect() {
            const select = document.getElementById('jump-select');
            quizData.forEach((_, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.text = `Câu ${idx + 1}`;
                select.appendChild(opt);
            });
        }

        function jumpToQuestion() {
            const select = document.getElementById('jump-select');
            currentIdx = parseInt(select.value);
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('q-text').innerText = `Câu ${currentIdx + 1}: ${q.q}`;
            document.getElementById('question-count').innerText = `Câu ${currentIdx + 1} / ${quizData.length}`;
            document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
            document.getElementById('jump-select').value = currentIdx;
            
            const list = document.getElementById('options-list');
            list.innerHTML = '';
            answered = false;
            document.getElementById('next-btn').disabled = true;

            q.a.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => checkAnswer(div, i);
                list.appendChild(div);
            });
        }

        function checkAnswer(el, idx) {
            if (answered) return;
            answered = true;
            const correctIdx = quizData[currentIdx].c;
            
            if (idx === correctIdx) {
                el.classList.add('correct');
                score++;
            } else {
                el.classList.add('wrong');
                const options = document.querySelectorAll('.option');
                if(options[correctIdx]) {
                    options[correctIdx].classList.add('correct');
                }
            }
            
            document.getElementById('score-display').innerText = `Đúng: ${score}`;
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            const screen = document.getElementById('result-screen');
            screen.style.display = 'block';
            document.getElementById('final-result').innerText = `${score}/${quizData.length}`;
            
            const percent = (score / quizData.length) * 100;
            let msg = "";
            if (percent === 100) msg = "Quá xuất sắc! Bạn là bậc thầy TTHCM.";
            else if (percent >= 80) msg = "Rất tốt! Bạn nắm kiến thức rất vững.";
            else if (percent >= 50) msg = "Tạm ổn, hãy ôn kỹ hơn các câu làm sai nhé.";
            else msg = "Bạn cần cố gắng nhiều hơn để vượt qua kỳ thi.";
            document.getElementById('feedback').innerText = msg;
        }

        if(quizData.length > 0) {
            initJumpSelect();
            loadQuestion();
        } else {
            document.getElementById('q-text').innerText = "Không tìm thấy câu hỏi nào.";
        }
    </script>
